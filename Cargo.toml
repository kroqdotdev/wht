[package]
name = "wht"
version = "0.1.0"
edition = "2024"
description = "Webhook Tester — CLI + Web GUI for sending HTTP requests with flexible rate, volume, and payload control"
license = "MIT"
repository = "https://github.com/kroqdotdev/wht"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
governor = "0.8"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
rand = "0.9"
chrono = "0.4"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
